[package]
name = "crystal-desktop"
version = "0.1.0"
description = "Crystal — a multi-facet IDE for building systems and their software"
authors = ["Crystal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crystal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
