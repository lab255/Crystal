[package]
name = "crystal-desktop"
version = "0.1.0"
description = "Crystal — a multi-facet IDE for building systems and their software"
authors = ["Crystal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crystal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pipe relay: the webview reaches the sidecar's IPC pipe through Rust (JS has
# no pipe access), so we need async pipe/socket clients.
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
# In-app auto-update: check the GitHub-hosted `latest.json`, verify the
# minisign signature against the pubkey in tauri.conf.json, download + swap the
# app, then relaunch (process plugin). Desktop-only — gated in lib.rs.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# System toasts for "needs you" transitions (new agent question / classified
# failure) — the WKWebView/WebView2 webview has no web Notification API, so
# the attention notifier in @crystal/client calls our `notify_attention`
# command (src/notifier.rs). Driven directly (not via the notification
# plugin) because click-to-jump needs the activation callback the plugin's
# fire-and-forget desktop backends drop; 4.18 is the first version with
# `wait_for_response` on all three desktop backends.
notify-rust = "4.18"

# Job object with kill-on-close: the OS reaps the whole sidecar tree even if
# the desktop process crashes without running its shutdown path.
[target.'cfg(windows)'.dependencies]
win32job = "2"
# Cheap pid-liveness probe for bridge instance discovery (OpenProcess with the
# weakest access right — no signaling, no memory reads). Already in the tree
# via tauri/tokio, so this adds no new compile unit version.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
