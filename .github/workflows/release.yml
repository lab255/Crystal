name: Release

# Desktop release for macOS (Apple Silicon) + Windows (x64), modelled on
# OpenBook's pipeline and adapted to Crystal's Node-SEA sidecar:
#
#   plan ─▶ preflight ─▶ release (approval gate) ─▶ publish-tauri ─▶ finalize
#
# A push to main runs `plan` (a dry-run that asks "do the commits since the last
# v* tag warrant a release?"). Only when they do is a reviewer asked to approve
# the `release` environment; `release` bumps + tags + pushes + drafts the GitHub
# release, the per-platform `publish-tauri` matrix builds/signs (and notarizes,
# on macOS) the bundles and attaches them, and `finalize` assembles the
# updater's latest.json and flips the release public.
#
# Why per-platform runners (not cross-compiling): Crystal's bridge sidecar is a
# Node Single-Executable-Application — build-sidecar.mjs copies the *running*
# node binary and injects the server blob, so it can only ever emit the host
# OS/arch. macOS Intel was dropped deliberately (no macos x64 leg); Apple
# Silicon builds on macos-14, Windows x64 on windows-latest, each native.
# Windows ships the NSIS installer unsigned (no Authenticode cert yet) — the
# updater still verifies the minisign .sig, which is what latest.json carries.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time. cancel-in-progress is OFF: a push landing mid-publish
# must not cancel an in-flight release (which could leave a half-attached tag).
# Stacked pushes queue instead; an un-approved release parked at the gate holds
# the queue until it's approved or rejected.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Is a release even due? Ungated dry-run so routine merges ping no one. ──
  plan:
    name: Plan (dry run)
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.plan.outputs.new_release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release.mjs reads conventional commits since last v* tag
      # No pnpm / cache: release.mjs is dependency-free (Node builtins + git), so
      # there is nothing to install and no pnpm store to cache — setup-node's
      # cache:pnpm post-step would error ("caching path does not exist").
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Determine whether a release is due
        id: plan
        run: node scripts/release.mjs --dry-run

  # ── Fail BEFORE anything irreversible if the signing prerequisites are unmet.
  # Updater signing is a HARD requirement: with createUpdaterArtifacts=true and a
  # pubkey in tauri.conf.json, `tauri build` errors out (it does NOT emit unsigned
  # archives) when TAURI_SIGNING_PRIVATE_KEY is absent. Notarization secrets are
  # asserted too so a release can't silently ship un-notarized (Gatekeeper would
  # block it). Secrets live in the `publish` environment; this job opts in to read
  # them. Presence checks only — nothing is echoed.
  preflight:
    name: Preflight — signing secrets
    needs: plan
    if: needs.plan.outputs.new_release == 'true'
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - name: Assert signing + notarization secrets are configured
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          fail=0
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is unset in the 'publish' environment. Updater signing is a hard prerequisite — with a pubkey configured in tauri.conf.json the build refuses to bundle without it. See docs/releasing.md." >&2
            fail=1
          fi
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Apple notarization secrets are incomplete (need APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID in the 'publish' environment). To ship un-notarized during bring-up, remove this Apple check. See docs/releasing.md." >&2
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "Signing prerequisites present — release may proceed."
          exit "$fail"

  # ── The release itself. The `release` environment is the approval gate:
  # Settings → Environments → release → Required reviewers. Until approved there,
  # this job (and everything downstream) stays queued.
  release:
    name: Release v${{ needs.plan.outputs.version }} (on approval)
    needs: [plan, preflight]
    if: needs.plan.outputs.new_release == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump commit + tag, create the release
    outputs:
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main # land the commit + tag on the branch, not a detached HEAD
      # No pnpm / cache — this job only runs release.mjs (Node builtins), git,
      # and gh; nothing installs deps (same reason as the plan job).
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Cut the release (bump, changelog, commit, tag)
        id: cut
        run: node scripts/release.mjs
      - name: Push the commit + tag
        # The default GITHUB_TOKEN push does NOT retrigger this on:push workflow
        # (GitHub's loop guard), so no release loop. If branch protection blocks
        # the push, swap in a deploy key (see docs/releasing.md).
        run: git push --follow-tags origin HEAD:main
      - name: Draft the GitHub release with the changelog section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ steps.cut.outputs.version }}"
          # Extract just this version's section from CHANGELOG.md (from its
          # `## v<ver>` header up to the next `## v` header).
          awk '/^## v/{c++} c==1' CHANGELOG.md > /tmp/notes.md
          # Draft: the release stays hidden (so releases/latest ignores it) until
          # `finalize` attaches latest.json and flips it public.
          gh release create "v$ver" --draft --title "Crystal v$ver" --notes-file /tmp/notes.md

  # ── Build, sign, notarize (macOS), and attach the per-platform bundles +
  # updater artifacts.
  publish-tauri:
    name: Build & attach (${{ matrix.os }} ${{ matrix.arch }})
    needs: release
    environment: publish
    permissions:
      contents: write # gh release upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon (Intel/x64 deliberately not shipped)
            target: aarch64-apple-darwin
            arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }} # the tag the release job pushed
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile

      # Import the Developer ID cert into a keychain OURSELVES (rather than letting
      # Tauri import APPLE_CERTIFICATE at signing time). Why: node-pty's nested
      # Mach-O (pty.node + spawn-helper) ship ad-hoc-signed and Tauri never signs
      # anything under Contents/Resources, so notarization rejects them. build-
      # sidecar Developer-ID-signs them during `tauri build`'s beforeBuildCommand
      # (see scripts/build-sidecar.mjs) — which needs the identity in a keychain
      # BEFORE the build starts, too early for Tauri's own import. One keychain +
      # one identity (via APPLE_SIGNING_IDENTITY below): importing the cert twice
      # would make `codesign` fail on an ambiguous identity match.
      - name: Import signing certificate into a keychain
        id: keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/crystal-signing.keychain-db"
          keypass="$(uuidgen)"
          security create-keychain -p "$keypass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"   # don't auto-lock mid-build
          security unlock-keychain -p "$keypass" "$keychain"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security import "$cert" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$cert"
          # Let codesign use the key non-interactively (no UI prompt on the runner).
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keypass" "$keychain" >/dev/null
          # Prepend our keychain to the user search list, keeping the defaults.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | sed 's/["]//g')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate — check APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Imported signing identity: $identity"

      # tauri build runs its beforeBuildCommand (web + Node-SEA sidecar) then
      # bundles. --target pins the output path (target/<triple>/release/bundle)
      # and arch-suffixes the dmg; on each runner target == host, so the sidecar
      # (host-only) lands at the externalBin path Tauri expects.
      - name: Build, sign, notarize
        env:
          # App signing uses the identity imported above (single keychain — do NOT
          # also pass APPLE_CERTIFICATE, which would import a duplicate and make
          # codesign's identity match ambiguous). build-sidecar reads the same
          # APPLE_SIGNING_IDENTITY to Developer-ID-sign node-pty's nested Mach-O
          # before Tauri seals the bundle. APPLE_ID + app-specific APPLE_PASSWORD +
          # APPLE_TEAM_ID drive notarytool. The Node-SEA sidecar's hardened-runtime
          # entitlements live in entitlements.plist (via tauri.conf.json).
          # On Windows the keychain step is skipped, so APPLE_SIGNING_IDENTITY is
          # empty and the APPLE_* set is inert — only the updater key matters.
          APPLE_SIGNING_IDENTITY: ${{ steps.keychain.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signing (minisign). Key material itself, not a path,
          # so nothing is written to disk. createUpdaterArtifacts=true + the pubkey
          # in tauri.conf.json make this a hard requirement (build errors if unset).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @crystal/desktop exec tauri build --target ${{ matrix.target }}

      # Fail loudly if signing was configured but produced no updater signature —
      # a bundle that can't be verified would ship un-updatable. macOS signs the
      # .app.tar.gz updater archive; Windows (NSIS, Tauri v2) signs the
      # -setup.exe installer itself.
      - name: Guard — updater signature exists
        shell: bash
        run: |
          base="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            sigs=("$base"/macos/*.sig)
          else
            sigs=("$base"/nsis/*.sig)
          fi
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "::error::No updater .sig under $base — updater artifact is unsigned (bad TAURI_SIGNING_PRIVATE_KEY or password?)." >&2
            find "$base" -maxdepth 2 -type f >&2 || true
            exit 1
          fi

      - name: Attach bundles + updater artifacts to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ needs.release.outputs.version }}"
          arch="${{ matrix.arch }}"
          base="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Tauri names the updater archive "Crystal.app.tar.gz" with no arch —
            # rename to the arch-suffixed name finalize/latest.json points at
            # (the .sig signs the archive BYTES, not the filename, so this is
            # safe; it also keeps room for more arches later).
            for archive in "$base"/macos/*.app.tar.gz; do
              dest="$base/macos/Crystal_${ver}_${arch}.app.tar.gz"
              [ "$archive" = "$dest" ] && continue
              mv "$archive" "$dest"
              [ -f "$archive.sig" ] && mv "$archive.sig" "$dest.sig"
            done
            files=( "$base"/dmg/*.dmg "$base"/macos/*.app.tar.gz "$base"/macos/*.sig )
          else
            # NSIS output is already versioned + arch-suffixed
            # (Crystal_<ver>_x64-setup.exe) and doubles as the updater artifact.
            files=( "$base"/nsis/*-setup.exe "$base"/nsis/*.sig )
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bundles under $base" >&2; find "$base" -maxdepth 2 -type f >&2 || true; exit 1
          fi
          printf 'Uploading:\n'; printf '  %s\n' "${files[@]}"
          gh release upload "v$ver" "${files[@]}" --clobber

  # ── Assemble the updater manifest across both platforms, then publish the
  # release.
  finalize:
    name: Finalize updater manifest
    needs: [release, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build latest.json from both platform signatures and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${{ needs.release.outputs.version }}"
          repo="${{ github.repository }}"
          base="https://github.com/$repo/releases/download/v$ver"
          # The .sig files carry the detached minisign signature the Tauri updater
          # checks against the pubkey baked into the app. macOS signs the
          # .app.tar.gz archive; Windows signs the NSIS -setup.exe itself.
          gh release download "v$ver" -p '*.sig' -D sigs
          sig_darwin=$(cat "sigs/Crystal_${ver}_aarch64.app.tar.gz.sig")
          sig_windows=$(cat "sigs/Crystal_${ver}_x64-setup.exe.sig")
          notes=$(gh release view "v$ver" --json body -q .body)
          jq -n \
            --arg ver "$ver" --arg notes "$notes" --arg base "$base" \
            --arg sd "$sig_darwin" --arg sw "$sig_windows" \
            '{
              version: $ver,
              notes: $notes,
              pub_date: (now | todateiso8601),
              platforms: {
                "darwin-aarch64":  { signature: $sd, url: "\($base)/Crystal_\($ver)_aarch64.app.tar.gz" },
                "windows-x86_64":  { signature: $sw, url: "\($base)/Crystal_\($ver)_x64-setup.exe" }
              }
            }' > latest.json
          gh release upload "v$ver" latest.json --clobber
          # Now that the manifest + bundles are all attached, publish: releases/
          # latest (and the updater endpoint) starts resolving to this release.
          gh release edit "v$ver" --draft=false --latest
