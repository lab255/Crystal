name: Desktop release

# Node SEA can't cross-compile (it patches the running node binary, and macOS
# must codesign locally), so each OS/arch artifact is built on its own runner.
#
# Bundles are UNSIGNED for now: macOS is ad-hoc signed (Gatekeeper will warn),
# Windows NSIS is unsigned, and no updater artifacts are produced. Signing and
# the updater pipeline come later (see OpenBook's release.yml for the shape
# that grows into — approval gate, nx release plan, per-leg signing preflight).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # attach bundles to the GitHub release on tag builds

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon → aarch64-apple-darwin
          - os: macos-13 # Intel → x86_64-apple-darwin
          - os: windows-latest # x86_64-pc-windows-msvc
          - os: ubuntu-22.04 # old glibc → portable AppImage/deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 prerequisites for ubuntu-22.04 (webkit2gtk 4.1 toolchain).
      # libayatana-appindicator3-dev: 22.04 dropped libappindicator3-dev.
      # libfuse2: linuxdeploy + its appimage plugin are AppImages themselves
      # and self-mount via FUSE; the runner image no longer ships it.
      - name: Install Linux system deps (webkit + tauri)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # beforeBuildCommand builds @crystal/web and the host sidecar (a Node
      # SEA of the bridge server, plus node-pty's prebuild staged as a Tauri
      # resource), then Tauri bundles everything.
      - run: pnpm --filter @crystal/desktop build

      # Installers/images only — the raw .app directory doesn't survive
      # artifact zipping (symlinks and executable bits are lost); the dmg is
      # the macOS deliverable.
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # Tag builds also attach the bundles to the release for the tag (created
      # here if it doesn't exist yet), so a `git tag vX.Y.Z && git push --tags`
      # is the whole release ritual.
      - name: Attach bundles to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
